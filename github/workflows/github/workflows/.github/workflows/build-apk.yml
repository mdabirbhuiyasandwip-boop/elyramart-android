github/workflows/build-apk.yml
name: Build Elyramart APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract source
        run: |
          unzip -q Elyramart_GitHub_Upload.zip -d extracted
          APP_DIR=$(find extracted -name pubspec.yaml -printf '%h\n' | head -1)
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV

      - name: Generate Android files
        run: |
          cd "$APP_DIR"
          flutter create --platforms=android --org com.elyramartbd --project-name elyramart --overwrite .

      - name: Get packages
        run: |
          cd "$APP_DIR"
          flutter pub get

      - name: Build APK
        run: |
          cd "$APP_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elyramart-APK
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
