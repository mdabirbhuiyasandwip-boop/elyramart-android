name: Deploy Elyramart Firebase backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-firebase.yml'

permissions:
  contents: read

concurrency:
  group: elyramart-firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Verify deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing repository secret FIREBASE_SERVICE_ACCOUNT_JSON."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          python3 - <<'PY'
import json, os, sys
path = os.path.join(os.environ['RUNNER_TEMP'], 'firebase-service-account.json')
with open(path, encoding='utf-8') as f:
    data = json.load(f)
required = ['type', 'project_id', 'private_key', 'client_email', 'token_uri']
missing = [key for key in required if not data.get(key)]
if data.get('type') != 'service_account' or missing:
    print('এই Secret-এ Service Account JSON নেই বা অসম্পূর্ণ। google-services.json নয়; Google Cloud service account key JSON প্রয়োজন।')
    print('Missing fields: ' + ', '.join(missing or ['type=service_account']))
    sys.exit(1)
if data.get('project_id') != 'elyramart':
    print('Service Account project_id elyramart নয়; সঠিক Firebase project-এর key দিন।')
    sys.exit(1)
print('Service Account JSON structure verified for elyramart.')
PY
      - name: Configure Firebase owner email
        run: |
          printf '%s\n' 'ELYRAMART_OWNER_EMAIL=elyramartbd@gmail.com' > functions/.env.elyramart
      - name: Install Firebase CLI and Functions dependencies
        run: |
          npm install --global firebase-tools@15.22.3
          cd functions
          npm install
          npm run build
      - name: Deploy Firestore, Storage rules and Cloud Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only firestore:rules,storage,functions --project elyramart --non-interactive
