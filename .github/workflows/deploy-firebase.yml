name: Deploy Elyramart Firebase backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'storage.rules'
      - '.github/workflows/deploy-firebase.yml'

permissions:
  contents: read

concurrency:
  group: elyramart-firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing repository secret FIREBASE_SERVICE_ACCOUNT_JSON."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          node -e "const fs=require('fs'); const p=process.env.RUNNER_TEMP+'/firebase-service-account.json'; const d=JSON.parse(fs.readFileSync(p,'utf8')); const required=['type','project_id','private_key','client_email','token_uri']; const missing=required.filter(k=>!d[k]); if(d.type!=='service_account'||missing.length){console.error('Secret-এ Service Account JSON নেই/অসম্পূর্ণ। google-services.json নয়; Google Cloud service account key JSON দিন. Missing: '+(missing.join(', ')||'type=service_account'));process.exit(1)} if(d.project_id!=='elyramart'){console.error('Service Account project_id elyramart নয়।');process.exit(1)} console.log('Service Account JSON verified for elyramart.')"
      - name: Configure Firebase owner email
        run: |
          printf '%s\\n' 'ELYRAMART_OWNER_EMAIL=elyramartbd@gmail.com' > functions/.env.elyramart
      - name: Install Firebase CLI and Functions dependencies
        run: |
          npm install --global firebase-tools@15.22.3
          cd functions
          npm install
          npm run build
      - name: Deploy Firestore rules without paid Cloud Functions
        if: vars.ENABLE_CLOUD_FUNCTIONS_DEPLOY != 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only firestore:rules --project elyramart --non-interactive
      - name: Deploy Firestore rules and Cloud Functions (Blaze billing required)
        if: vars.ENABLE_CLOUD_FUNCTIONS_DEPLOY == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only firestore:rules,functions --project elyramart --non-interactive
      - name: Deploy Storage rules (requires an active Firebase Storage bucket)
        if: vars.ENABLE_FIREBASE_STORAGE_DEPLOY == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only storage --project elyramart --non-interactive
      - name: Explain Storage deployment is paused
        if: vars.ENABLE_FIREBASE_STORAGE_DEPLOY != 'true'
        run: |
          echo "Storage deployment skipped. Create/activate the Firebase Storage bucket on the Blaze plan, then set ENABLE_FIREBASE_STORAGE_DEPLOY=true."
