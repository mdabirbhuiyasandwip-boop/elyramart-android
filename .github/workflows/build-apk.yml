name: Build Elyramart APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: elyramart-android-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify Flutter source
        run: |
          test -s pubspec.yaml
          test -s lib/main.dart
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --org com.elyramartbd --project-name elyramart .
      - name: Configure Firebase for Android
        run: |
          test -s google-services.json
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          p = "android/app/build.gradle"
          s = open(p, encoding="utf-8").read()
          needle = '    id "dev.flutter.flutter-gradle-plugin"'
          if needle not in s:
              raise SystemExit("Flutter Gradle plugin declaration not found")
          s = s.replace(needle, needle + '\n    id "com.google.gms.google-services" version "4.4.2"', 1)
          open(p, "w", encoding="utf-8").write(s)
          PY
      - name: Add Android network and location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
          ]
          missing = [line for line in permissions if line not in s]
          if missing:
              s = s.replace("<application", "\\n".join(missing) + "\\n    <application", 1)
              p.write_text(s, encoding="utf-8")
          PY
      - name: Generate Elyramart E-only brand icons
        run: |
          python3 -m pip install pillow --break-system-packages
          python3 tools/generate_brand_assets.py
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze Dart source
        run: |
          flutter analyze --no-pub > /tmp/elyramart-analyze.log 2>&1 || true
          cat /tmp/elyramart-analyze.log
          if grep -Eq ' (error|warning) •' /tmp/elyramart-analyze.log; then exit 1; fi
      - name: Run widget tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elyramart-APK-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
