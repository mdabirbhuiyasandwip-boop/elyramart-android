name: Build Elyramart APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: elyramart-android-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify Flutter source
        run: |
          test -s pubspec.yaml
          test -s lib/main.dart
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --org com.elyramartbd --project-name elyramart .
      - name: Configure Firebase for Android
        run: |
          test -s google-services.json
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          sed -i '/id "dev.flutter.flutter-gradle-plugin"/a\\    id "com.google.gms.google-services" version "4.4.2"' android/app/build.gradle
      - name: Add Android location permissions
        run: |
          sed -i '/<application/i\\    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />' android/app/src/main/AndroidManifest.xml
      - name: Generate Elyramart E-only brand icons
        run: |
          python3 -m pip install pillow --break-system-packages
          python3 tools/generate_brand_assets.py
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze Dart source
        run: |
          flutter analyze --no-pub > /tmp/elyramart-analyze.log 2>&1 || true
          cat /tmp/elyramart-analyze.log
          if grep -Eq ' (error|warning) •' /tmp/elyramart-analyze.log; then exit 1; fi
      - name: Run widget tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elyramart-APK-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
