name: Build Elyramart APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'google-services.json'
      - 'codemagic.yaml'
      - 'tools/generate_brand_assets.py'
      - 'tools/configure_android_signing.py'
      - '.github/workflows/build-apk.yml'

concurrency:
  group: elyramart-android-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
      - name: Verify Flutter source
        run: |
          test -s pubspec.yaml
          test -s lib/main.dart
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: flutter create --platforms=android --org com.elyramartbd --project-name elyramart .
      - name: Configure Firebase for Android
        run: |
          test -s google-services.json
          mkdir -p android/app
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")
          p = kotlin if kotlin.exists() else groovy
          if not p.exists():
              raise SystemExit("Android app Gradle file not found")
          s = p.read_text(encoding="utf-8")
          if p.suffix == ".kts":
              needle = '    id("dev.flutter.flutter-gradle-plugin")'
              plugin = '    id("com.google.gms.google-services") version "4.4.2"'
          else:
              needle = '    id "dev.flutter.flutter-gradle-plugin"'
              plugin = '    id "com.google.gms.google-services" version "4.4.2"'
          if plugin not in s:
              if needle not in s:
                  raise SystemExit("Flutter Gradle plugin declaration not found")
              s = s.replace(needle, needle + "\n" + plugin, 1)
          lint_block = ('\nandroid {\n    lint { checkReleaseBuilds = false }\n}\n'
                        if p.suffix == ".kts"
                        else '\nandroid {\n    lint { checkReleaseBuilds false }\n}\n')
          if "checkReleaseBuilds" not in s:
              s += lint_block
          p.write_text(s, encoding="utf-8")
          PY
      - name: Add Android network and location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text(encoding="utf-8")
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
          ]
          missing = [line for line in permissions if line not in s]
          if missing:
              s = s.replace("<application", "\n".join(missing) + "\n    <application", 1)
              p.write_text(s, encoding="utf-8")
          PY
      - name: Configure optional Play Store upload signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tools/configure_android_signing.py
      - name: Generate Elyramart E-only brand icons
        run: |
          python3 -m pip install pillow --break-system-packages
          python3 tools/generate_brand_assets.py
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze Dart source
        run: |
          flutter analyze --no-pub > /tmp/elyramart-analyze.log 2>&1 || true
          cat /tmp/elyramart-analyze.log
          if grep -Eq ' (error|warning) •' /tmp/elyramart-analyze.log; then exit 1; fi
      - name: Run widget tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Build Play Store Android App Bundle
        run: flutter build appbundle --release
      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Elyramart-Play-Store-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elyramart-APK-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
