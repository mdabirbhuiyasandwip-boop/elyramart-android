name: Build Elyramart Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'tools/**'
      - '.github/workflows/build-web.yml'

permissions:
  contents: read

concurrency:
  group: elyramart-web-build
  cancel-in-progress: false

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify Flutter source
        run: |
          test -s pubspec.yaml
          test -s lib/main.dart
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Web project files
        run: flutter create --platforms=web --org com.elyramartbd --project-name elyramart .
      - name: Generate Elyramart E-only brand icons
        run: |
          python3 -m pip install pillow --break-system-packages
          python3 tools/generate_brand_assets.py
          python3 tools/configure_web_pwa.py
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze Dart source
        run: |
          flutter analyze --no-pub > /tmp/elyramart-analyze.log 2>&1 || true
          cat /tmp/elyramart-analyze.log
          if grep -Eq ' (error|warning) •' /tmp/elyramart-analyze.log; then exit 1; fi
      - name: Run widget tests
        run: flutter test
      - name: Build responsive Web app
        env:
          ELYRAMART_FIREBASE_WEB_API_KEY: ${{ secrets.ELYRAMART_FIREBASE_WEB_API_KEY }}
          ELYRAMART_FIREBASE_WEB_APP_ID: ${{ secrets.ELYRAMART_FIREBASE_WEB_APP_ID }}
          ELYRAMART_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.ELYRAMART_FIREBASE_MESSAGING_SENDER_ID }}
          ELYRAMART_FIREBASE_PROJECT_ID: ${{ secrets.ELYRAMART_FIREBASE_PROJECT_ID }}
          ELYRAMART_FIREBASE_AUTH_DOMAIN: ${{ secrets.ELYRAMART_FIREBASE_AUTH_DOMAIN }}
          ELYRAMART_FIREBASE_STORAGE_BUCKET: ${{ secrets.ELYRAMART_FIREBASE_STORAGE_BUCKET }}
        run: |
          flutter build web --release \
            --dart-define=ELYRAMART_FIREBASE_WEB_API_KEY="$ELYRAMART_FIREBASE_WEB_API_KEY" \
            --dart-define=ELYRAMART_FIREBASE_WEB_APP_ID="$ELYRAMART_FIREBASE_WEB_APP_ID" \
            --dart-define=ELYRAMART_FIREBASE_MESSAGING_SENDER_ID="$ELYRAMART_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=ELYRAMART_FIREBASE_PROJECT_ID="$ELYRAMART_FIREBASE_PROJECT_ID" \
            --dart-define=ELYRAMART_FIREBASE_AUTH_DOMAIN="$ELYRAMART_FIREBASE_AUTH_DOMAIN" \
            --dart-define=ELYRAMART_FIREBASE_STORAGE_BUCKET="$ELYRAMART_FIREBASE_STORAGE_BUCKET"
      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: Elyramart-Web-release
          path: build/web/
          if-no-files-found: error
          retention-days: 14
