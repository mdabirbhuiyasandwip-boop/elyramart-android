name: Build Elyramart Web

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: elyramart-web-build
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify Flutter source
        run: |
          test -s pubspec.yaml
          test -s lib/main.dart
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Web project files
        run: flutter create --platforms=web --org com.elyramartbd --project-name elyramart --overwrite .
      - name: Generate Elyramart E-only brand icons
        run: |
          python3 -m pip install --user pillow
          python3 tools/generate_brand_assets.py
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze --no-pub
      - name: Build responsive Web app
        run: flutter build web --release
      - name: Upload Web build
        uses: actions/upload-artifact@v4
        with:
          name: Elyramart-Web-release
          path: build/web/
          if-no-files-found: error
          retention-days: 14
